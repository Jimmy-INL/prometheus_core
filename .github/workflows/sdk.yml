name: sdk

on:
  push:
    branches: [devel]
  pull_request:
    branches: [main, devel]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: sdk

jobs:
  python:
    name: "python ${{ matrix.python }}"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - name: Sync environment
        run: uv sync --frozen
      - name: Test
        run: uv run --frozen pytest --color=yes

  docker:
    name: "docker ${{ matrix.platform }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platform }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sdk
          file: sdk/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: false
          load: true
          tags: sdk:${{ matrix.platform }}
      - name: Test
        # The image only has the installed package; mount the checkout for
        # pyproject.toml, uv.lock, and the tests
        run: |
          docker run --rm --platform linux/${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            sdk:${{ matrix.platform }} \
            bash -ec '
              uv export --frozen --only-dev > requirements.txt
              uv pip install -r requirements.txt
              rm requirements.txt
              pytest --color=yes
            '
