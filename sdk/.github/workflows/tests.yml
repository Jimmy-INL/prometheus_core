name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_URL: containers.github.inl.gov
  REGISTRY_PACKAGE_URL: containers.github.inl.gov/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  python:
    name: "Python ${{ matrix.python }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: 3.12
            image: docker.io/python:3.12.13-slim@sha256:d764629ce0ddd8c71fd371e9901efb324a95789d2315a47db7e4d27e78f1b0e9
          - python: 3.13
            image: docker.io/python:3.13.13-slim@sha256:aa938a849bcb82dce8f49480f056ab82bf5c1c3ebc294f0430f37b6820e7f286
          - python: 3.14
            image: docker.io/python:3.14.6-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061
    runs-on:
      group: genesis
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: python -m pip install --no-cache uv
      - name: Sync environment
        run: uv sync --frozen --no-cache
      - name: Test
        shell: bash
        run: |
          source .venv/bin/activate
          pytest --color=yes

  docker-prepare:
    name: "Docker prepare"
    needs:
      - python
    runs-on:
      group: genesis
    outputs:
      build-tag: ${{ steps.prepare.outputs.build-tag }}
      cache-uri: ${{ steps.prepare.outputs.cache-uri }}
      current-tag: ${{ steps.prepare.outputs.current-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare
        id: prepare
        shell: bash
        run: |
          DATE_TAG="$(git log -1 --format=%cd --date=format:'%Y%m%d')"
          COMMIT_TAG="$(git rev-parse HEAD | cut -c1-7)"

          VALUES=(
            "build-tag=${{ github.event.repository.name }}-build:run-${{ github.run_id }}"
            "cache-uri=${REGISTRY_PACKAGE_URL}-cache"
            "current-tag=${DATE_TAG}-${COMMIT_TAG}"
          )
          for VALUE in "${VALUES[@]}"; do
            echo "$VALUE"
            echo "$VALUE" >> $GITHUB_OUTPUT
          done

  docker:
    name: "Docker ${{ matrix.platform }}"
    runs-on:
      group: genesis
    permissions:
      contents: read
      packages: write
    needs:
      - docker-prepare
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    env:
      BUILD_TAG: "${{ needs.docker-prepare.outputs.build-tag }}-${{ matrix.platform }}"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY_URL" \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Build
        shell: bash
        run: |
          CACHE_URI="${{ needs.docker-prepare.outputs.cache-uri }}"
          test -n "$CACHE_URI"
          CACHE_URI+="-${{ matrix.platform }}"

          EXTRA_ARGS=()
          if [ "$GITHUB_EVENT_NAME" == "push" ]; then
            EXTRA_ARGS+=("--cache-to" "$CACHE_URI")
          fi

          docker build \
            --tag "$BUILD_TAG" \
            --platform "linux/${{ matrix.platform }}" \
            --layers \
            --cache-from "$CACHE_URI" \
            "${EXTRA_ARGS[@]}" \
            .
      - name: Test
        shell: bash
        run: |
          rm -rf prometheus_api

          cat << 'EOF' > run.bash
          #!/bin/bash
          set -e
          uv export --frozen --only-dev > requirements.txt
          uv pip install -r requirements.txt
          rm requirements.txt
          pytest --color=yes
          EOF

          docker run \
            --mount "type=bind,source=${{ github.workspace }},target=${{ github.workspace }}" \
            --workdir "${{ github.workspace }}" \
            --platform "linux/${{ matrix.platform }}" \
            --rm \
            "$BUILD_TAG" \
            /bin/bash run.bash
      - name: Push
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          CURRENT_TAG="${{ needs.docker-prepare.outputs.current-tag }}"
          test -n "$CURRENT_TAG"

          for TAG in "$CURRENT_TAG" latest; do
            TO_URI="${REGISTRY_PACKAGE_URL}:${TAG}-${{ matrix.platform }}"
            docker tag "$BUILD_TAG" "$TO_URI"
            docker push "$TO_URI"
            docker rmi "$TO_URI"
          done
      - name: Registry logout
        if: always()
        run: docker logout "$REGISTRY_URL" || true
      - name: Remove docker image
        if: always()
        run: docker rmi "$BUILD_TAG" || true

  docker-mutli-arch:
    name: "Docker multi-arch"
    if: success() && github.event_name == 'push'
    runs-on:
      group: genesis
    permissions:
      contents: read
      packages: write
    needs:
      - docker-prepare
      - docker
    steps:
      - name: Registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY_URL" \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Push multi-arch container
        shell: bash
        run: |
          CURRENT_TAG="${{ needs.docker-prepare.outputs.current-tag }}"
          test -n "$CURRENT_TAG"

          # Get each URI we want to be in the manifest and
          # make sure that it exists
          ARCH_URIS=()
          for PLATFORM in amd64 arm64; do
            URI="${REGISTRY_PACKAGE_URL}:${CURRENT_TAG}-${PLATFORM}"
            ARCH_URIS+=("$URI")
            if ! docker manifest inspect "$URI" &> /dev/null; then
              echo "::error::Container $URI is missing"
              exit 1
            fi
          done

          # Create manifest based on specific tag
          CURRENT_URI="${REGISTRY_PACKAGE_URL}:${CURRENT_TAG}"
          docker manifest create "$CURRENT_URI" "${ALL_URIS[@]}"
          docker manifest push "$CURRENT_URI"

          # And also push as the latest tag
          LATEST_URI="${REGISTRY_PACKAGE_URL}:latest"
          docker manifest push "$CURRENT_URI" "$LATEST_URI"

          # Cleanup
          docker manifest rm "$CURRENT_URI"
      - name: Registry logout
        if: always()
        run: docker logout "$REGISTRY_URL" || true
