name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: "Python ${{ matrix.python }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: 3.12
            image: docker.io/python:3.12.13-slim@sha256:d764629ce0ddd8c71fd371e9901efb324a95789d2315a47db7e4d27e78f1b0e9
          - python: 3.13
            image: docker.io/python:3.13.13-slim@sha256:aa938a849bcb82dce8f49480f056ab82bf5c1c3ebc294f0430f37b6820e7f286
          - python: 3.14
            image: docker.io/python:3.14.6-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061
    runs-on:
      group: genesis
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        run: python -m pip install uv
      - name: Sync environment
        run: uv sync
      - name: Test
        shell: bash
        run: |
          source .venv/bin/activate
          pytest --color=yes

  docker:
    name: "Docker ${{ matrix.platform }}"
    runs-on:
      group: genesis
    permissions:
      contents: read
      packages: write
    needs: [python]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare
        id: prepare
        run: |
          value="tag=prometheus_api:${{ github.run_id }}"
          echo "$value"
          echo "$value" >> $GITHUB_OUTPUT
          echo
      - name: Registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login containers.github.inl.gov \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Build
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          test -n "$TAG"

          docker build \
            --tag "$TAG" \
            --platform "linux/${{ matrix.platform }}" \
            --cache-from "containers.github.inl.gov/genesis/prometheus_api" \
            .
      - name: Test
        shell: bash
        run: |
          rm -rf prometheus_api

          cat << 'EOF' > run.bash
          #!/bin/bash
          set -e
          uv export --frozen --only-dev > requirements.txt
          uv pip install -r requirements.txt
          rm requirements.txt
          pytest --color=yes
          EOF

          docker run \
            --mount "type=bind,source=${{ github.workspace }},target=${{ github.workspace }}" \
            --workdir "${{ github.workspace }}" \
            --platform "linux/${{ matrix.platform }}" \
            --rm \
            "${{ steps.prepare.outputs.tag }}" \
            /bin/bash run.bash
      - name: Push
        # if: success() && github.event_name == 'push'
        shell: bash
        run: |
          date_tag="$(git log -1 --format=%cd --date=format:'%Y%m%d')"
          commit_tag="$(git rev-parse HEAD | cut -c1-7)"

          for tag in "${date_tag}-${commit_tag}" latest; do
            uri="containers.github.inl.gov/genesis/prometheus_api:${tag}"
            docker tag "${{ steps.prepare.outputs.tag }}" "$tag"
            docker push "$tag"
            docker tag "${{ steps.prepare.outputs.tag }}" "$tag"
            docker rmi "$tag"
          done
