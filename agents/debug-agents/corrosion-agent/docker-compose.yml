services:
  corrosion-agent:
    build:
      args:
        - PROMETHEUS_API_BASE_IMAGE_HASH=${PROMETHEUS_API_BASE_IMAGE_HASH:-43dedaa}
        - HTTP_PROXY=${HTTP_PROXY-""}
        - HTTPS_PROXY=${HTTPS_PROXY-""}
        - NO_PROXY=${NO_PROXY-""}
    container_name: corrosion-agent
    networks:
      - agent-network
    environment:
      AGENT_HOST: corrosion-agent
      AGENT_PORT: 8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-""}
      MODEL_NAME: ${MODEL_NAME:-claude-sonnet-4-6}
      AGENT_SECRET: ${AGENT_SECRET}
      SSL_CERT_FILE: /etc/ssl/certs/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-bundle.pem
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-bundle.pem
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ../../../certs/ca-bundle.pem:/etc/ssl/certs/ca-bundle.pem
      - ../../../shared:/app/shared
    restart: unless-stopped
