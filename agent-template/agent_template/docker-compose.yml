services:
  TEMPLATE_SLUG-agent:
    build:
      context: .
      args:
        # Passed in from the platform's Makefile (or your own .env).
        PROMETHEUS_API_BASE_IMAGE_HASH: ${PROMETHEUS_API_BASE_IMAGE_HASH}
        # Corporate proxy settings (optional — leave empty if not behind a proxy).
        HTTP_PROXY: ${HTTP_PROXY:-""}
        HTTPS_PROXY: ${HTTPS_PROXY:-""}
        NO_PROXY: ${NO_PROXY:-""}
    container_name: TEMPLATE_SLUG-agent
    networks:
      - agent-network
    environment:
      AGENT_PORT: 8000
      AGENT_HOST: TEMPLATE_SLUG-agent
      AGENT_SECRET: ${AGENT_SECRET}
      AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
      REGISTRY_URL: ${REGISTRY_URL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Add your own agent-specific variables here (and in .env):
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-""}
      MODEL_NAME: ${MODEL_NAME:-claude-sonnet-4-6}
      PYTHONDONTWRITEBYTECODE: 1
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Network configuration — choose ONE of the two blocks below based on how you
# are deploying this agent.  Delete the one you are not using.
# -----------------------------------------------------------------------------

# OPTION A — External repo (this agent runs alongside the platform but in its
# own docker-compose project).  The platform creates the network; this agent
# joins it.  Replace "prometheus_platform" with the actual COMPOSE_PROJECT_NAME
# if your platform team changed it.
networks:
  agent-network:
    external: true
    name: prometheus_platform_agent-network

# OPTION B — In-tree (agent lives inside prometheus_platform/agents/<name>/).
# The platform's docker-compose.yml owns the network definition; agents just
# reference it by name.  To use this, delete the OPTION A block above and
# uncomment the lines below.
#
# networks:
#   agent-network:
