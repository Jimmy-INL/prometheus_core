services:
  osti-research-agent:
    build:
      context: .
      args:
        - PROMETHEUS_API_BASE_IMAGE_HASH=${PROMETHEUS_API_BASE_IMAGE_HASH}
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    container_name: osti-research-agent
    networks:
      - agent-network
    environment:
      AGENT_PORT: 8000
      AGENT_SECRET: ${AGENT_SECRET}
      REGISTRY_URL: ${REGISTRY_URL:-http://litellm:4000}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-medium}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../shared:/app/shared
      - osti-model-cache:/root/.cache/datalab
      - huggingface-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
    restart: unless-stopped

volumes:
  osti-model-cache:
  huggingface-cache:
  torch-cache:
