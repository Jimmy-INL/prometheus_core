# Prometheus Platform - Combined Docker Compose
# Chainlit frontend + LangGraph client-agent + specialist agents
# LiteLLM acts as the A2A agent gateway (replaces homemade registry)

services:
  # PostgreSQL — persistent store for LiteLLM agent registrations
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # LiteLLM proxy — A2A agent gateway and optional LLM proxy
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - agent-network
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Redis for shared state (conversations, status, artifacts)
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - agent-network
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped

  # Chainlit frontend UI
  chainlit-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      additional_contexts:
        certs: ./certs
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: chainlit-frontend
    ports:
      - "8500:8500"
    networks:
      - agent-network
    environment:
      - CLIENT_AGENT_URL=http://client-agent:8000
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AGENT_SECRET=${AGENT_SECRET}
      - CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./shared:/app/shared
    depends_on:
      litellm:
        condition: service_healthy
      client-agent:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  # Client agent - orchestrates the workflow using LangGraph + Claude
  client-agent:
    build:
      context: ./agents/client-agent
      additional_contexts:
        certs: ./certs
        prometheus_api: ./prometheus_api
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: client-agent
    ports:
      - "8001:8000"
    networks:
      - agent-network
    environment:
      - AGENT_HOST=client-agent
      - AGENT_PORT=8000
      - LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - AGENT_SECRET=${AGENT_SECRET}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.pem
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-bundle.pem
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-bundle.pem
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped

  # Corrosion analysis specialist
  corrosion-agent:
    build:
      context: ./agents/corrosion-agent
      additional_contexts:
