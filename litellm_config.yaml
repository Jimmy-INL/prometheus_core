# LiteLLM Proxy Configuration
# Used as the A2A agent gateway and shared LLM proxy.
# Agent registration is done at runtime via POST /v1/agents.
# Runtime agents use the generic aliases configured here through LLMClient.

model_list:
  - model_name: medium
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  store_model_in_db: true
  forward_client_headers_to_llm_api: true
