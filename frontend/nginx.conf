server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API (FastAPI `backend` service on the agent-network, container port 8000).
    # proxy_pass has no path so the original `/api/...` URI is preserved verbatim.
    # buffering/cache are off and the read timeout is long so the /api/events SSE
    # stream is delivered incrementally rather than held until the response closes
    # (see backend/app/services/events.py).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
