# LiteLLM fallback configuration for local Prometheus API development.
#
# Copy this file before editing local values:
#
#   cp llm_config.example.yaml llm_config.yaml
#
# Then set:
#
#   LLM_CONFIG_FILE=./llm_config.yaml
#
# This file is used only by prometheus_api.llm_client when the LiteLLM registry
# configured by REGISTRY_URL cannot be reached, or when REGISTRY_URL is not set.
# If the proxy is reachable but rejects a model or request, the client does not
# fall back to this file. That keeps proxy policy and routing errors visible.
#
# Keep real provider keys in your shell or .env file. Do not paste API keys into
# this YAML file. LiteLLM resolves os.environ/NAME values at call time.
#
# Alias contract used by LLMClient:
# - default: used by LLMClient() and llm.chat(..., model=None)
# - small: fast/low-cost chat
# - medium: general analysis chat
# - large: deeper analysis chat
# - vision: multimodal chat when the selected provider model supports it
# - embedding: vector embeddings
#
# Model IDs below are examples. Replace them with models available in your
# provider account or in your organization's LiteLLM configuration.
#
# Optional provider base URLs:
# Add api_base under any litellm_params block when the fallback SDK should call
# a provider-compatible endpoint other than that provider's default. This is
# useful for local OpenAI-compatible servers, private gateways, or Azure/OpenAI
# compatibility layers. Leave api_base commented out when using the provider
# default endpoint.

model_list:
  - model_name: default
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
      # api_base: http://localhost:8000/v1

  - model_name: small
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
      # api_base: http://localhost:8000/v1

  - model_name: medium
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
      # api_base: http://localhost:8000/v1

  - model_name: large
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
      # api_base: https://api.anthropic.com

  - model_name: vision
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
      # api_base: http://localhost:8000/v1

  - model_name: embedding
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY
      # api_base: http://localhost:8000/v1
