# American Science Cloud OpenAI-compatible inference scaffold.
# Replace model IDs and the shared endpoint for the target AMSc deployment.

model_list:
  - model_name: default
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/AMSC_I2_API_KEY
      api_base: https://api.i2-core.american-science-cloud.org/v1

  - model_name: small
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/AMSC_I2_API_KEY
      api_base: https://api.i2-core.american-science-cloud.org/v1

  - model_name: medium
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/AMSC_I2_API_KEY
      api_base: https://api.i2-core.american-science-cloud.org/v1

  - model_name: large
    litellm_params:
      model: openai/claude-opus-4-6
      api_key: os.environ/AMSC_I2_API_KEY
      api_base: https://api.i2-core.american-science-cloud.org/v1

  - model_name: vision
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/AMSC_I2_API_KEY
      api_base: https://api.i2-core.american-science-cloud.org/v1

  - model_name: embedding
    litellm_params:
      model: openai/text-embedding-ada-002
      api_key: os.environ/AMSC_I2_API_KEY
      api_base: https://api.i2-core.american-science-cloud.org/v1
