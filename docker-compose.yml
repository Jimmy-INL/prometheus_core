# Prometheus Platform - Core Infrastructure
# Infrastructure, frontend, and client-agent only.
# Specialist agents are included via docker-compose.agents.yml (generated by make).

x-common-env: &common-env
  AGENT_SECRET: ${AGENT_SECRET}
  AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
  REGISTRY_URL: ${REGISTRY_URL:-http://litellm:4000}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  DEEPLYNX_BASE_URL: ${DEEPLYNX_BASE_URL:-https://deeplynx.inl.gov/api/v1}
  DEEPLYNX_KEY: ${DEEPLYNX_KEY:-}
  DEEPLYNX_SECRET: ${DEEPLYNX_SECRET:-}
  DEEPLYNX_ORG_ID: ${DEEPLYNX_ORG_ID:-}
  DEEPLYNX_PROJECT_ID: ${DEEPLYNX_PROJECT_ID:-}
  PROMETHEUS_MAX_UPLOAD_BYTES: ${PROMETHEUS_MAX_UPLOAD_BYTES:-104857600}
  # Multi-user identity plane: the backend mints a short-lived JWT per turn
  # (USER_IDENTITY_SECRET/RS256 keys); agents verify it. See
  # docs/dev-docs/multi-user-setup.md.
  USER_IDENTITY_SECRET: ${USER_IDENTITY_SECRET:-}
  USER_IDENTITY_ALG: ${USER_IDENTITY_ALG:-HS256}
  USER_IDENTITY_ISS: ${USER_IDENTITY_ISS:-prometheus-platform}
  USER_IDENTITY_AUD: ${USER_IDENTITY_AUD:-prometheus-agents}
  USER_IDENTITY_TTL: ${USER_IDENTITY_TTL:-7200}
  USER_IDENTITY_REQUIRED: ${USER_IDENTITY_REQUIRED:-true}
  # Multi-user credential plane: per-user JIT credentials for third-party
  # resources (DeepLynx, SLURM). "env" (default) preserves today's global
  # credential behavior; "vault" activates per-user Vault policies.
  CREDENTIAL_BROKER: ${CREDENTIAL_BROKER:-env}

x-common-volumes: &common-volumes
  - ./shared:/app/shared

x-build-args: &prometheus-api-build-args
  PROMETHEUS_API_BASE_IMAGE_HASH: ${PROMETHEUS_API_BASE_IMAGE_HASH:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}

networks:
  agent-network:
    driver: bridge

volumes:
  valkey-data:
  litellm-db-data:

services:

  # PostgreSQL — persistent store for LiteLLM agent registrations
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # LiteLLM proxy — A2A agent gateway and optional LLM proxy
  litellm:
    image: ghcr.io/berriai/litellm:v1.92.0
    container_name: litellm-proxy
    ports:
      - "${LITELLM_LOCAL_PORT}:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: True
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000", "--telemetry", "false"]
    networks:
      - agent-network
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Valkey for Redis-compatible shared state (conversations, status, artifacts).
  # The service name stays "redis" so existing REDIS_URL values keep working.
  redis:
    image: valkey/valkey-bundle:9.1.0
    container_name: agent-valkey
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_LOCAL_PORT:-6379}:6379"
    networks:
      - agent-network
    volumes:
      - valkey-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # Client agent - orchestrates the workflow using LangGraph + Claude
  client-agent:
    build:
      context: ./agents/client-agent
      args:
        <<: *prometheus-api-build-args
    container_name: client-agent
    networks:
      - agent-network
    environment:
      <<: *common-env
      AGENT_PORT: 8000
      LLM_CONFIG_PROFILE: ${LLM_CONFIG_PROFILE:-registry}
      LLM_CONFIG_FILE: ${LLM_CONFIG_FILE:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INL_HPC_API_KEY: ${INL_HPC_API_KEY:-}
      INL_LITELLM_API_KEY: ${INL_LITELLM_API_KEY:-}
      AMSC_I2_API_KEY: ${AMSC_I2_API_KEY:-}
    volumes: *common-volumes
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Standalone FastAPI backend (replaces Chainlit's server role; see backend/).
  # The React frontend now lives in frontend/ (built by the frontend-dev /
  # frontend-prod services below); the old Chainlit frontend has been removed.
  backend:
    build:
      context: ./backend
      args:
        <<: *prometheus-api-build-args
    container_name: backend
    ports:
      - "${BACKEND_PORT:-8600}:8000"
    networks:
      - agent-network
    environment:
      <<: *common-env
      CLIENT_AGENT_URL: ${CLIENT_AGENT_URL:-http://client-agent:8000}
      # Session-cookie signing secret. BACKEND_JWT_SECRET takes precedence;
      # CHAINLIT_AUTH_SECRET is the documented fallback (see backend/app/config.py),
      # so it must be forwarded into the container or login fails with an empty key.
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-}
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:-}
    volumes: *common-volumes
    depends_on:
      redis:
        condition: service_started
      client-agent:
        condition: service_started
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
      additional_contexts:
        certs: ./certs
    container_name: frontend-dev
    ports:
      - "${FRONTEND_DEV_PORT:-5150}:5150"
    networks:
      - agent-network
    environment:
      VITE_CHAINLIT_SERVER: http://chainlit-frontend:8500
      # backend is a sibling container on agent-network. Proxy /api to it by
      # service name + internal port (8000), NOT the host-mapped 8600 — inside this
      # container localhost:8600 is its own loopback and refuses the connection.
      VITE_BACKEND_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # depends_on:
    #   chainlit-frontend:
    #     condition: service_started
    restart: unless-stopped

  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      additional_contexts:
        certs: ./certs
    container_name: frontend-prod
    ports:
      - "${FRONTEND_PROD_PORT:-8080}:8080"
    networks:
      - agent-network
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
