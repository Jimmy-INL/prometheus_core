services:
  form-filler-agent:
    build:
      context: .
      args:
        - PROMETHEUS_API_BASE_IMAGE_HASH=${PROMETHEUS_API_BASE_IMAGE_HASH}
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    container_name: form-filler-agent
    networks:
      - agent-network
    environment:
      AGENT_PORT: 8000
      AGENT_SECRET: ${AGENT_SECRET}
      REGISTRY_URL: ${REGISTRY_URL:-http://litellm:4000}
      LLM_CONFIG_PROFILE: ${LLM_CONFIG_PROFILE:-registry}
      LLM_CONFIG_FILE: ${LLM_CONFIG_FILE:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INL_HPC_API_KEY: ${INL_HPC_API_KEY:-}
      INL_LITELLM_API_KEY: ${INL_LITELLM_API_KEY:-}
      AMSC_I2_API_KEY: ${AMSC_I2_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ../../shared:/app/shared
    restart: unless-stopped
