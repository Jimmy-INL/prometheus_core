services:
  artifact-debug-agent:
    build:
      args:
        - PROMETHEUS_API_BASE_IMAGE_HASH=${PROMETHEUS_API_BASE_IMAGE_HASH:-43dedaa}
        - HTTP_PROXY=${HTTP_PROXY-""}
        - HTTPS_PROXY=${HTTPS_PROXY-""}
        - NO_PROXY=${NO_PROXY-""}
    container_name: artifact-debug-agent
    ports:
      - "${ARTIFACT_DEBUG_PORT:-8008}:8000"
    networks:
      - agent-network
    environment:
      AGENT_PORT: 8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-""}
      MODEL_NAME: ${MODEL_NAME:-claude-sonnet-4-6}
      AGENT_SECRET: ${AGENT_SECRET}
      SSL_CERT_FILE: /etc/ssl/certs/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-bundle.pem
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-bundle.pem
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
      PYTHONDONTWRITEBYTECODE: 1
      DEEPLYNX_BASE_URL: ${DEEPLYNX_BASE_URL:-https://deeplynx.inl.gov/api/v1}
      DEEPLYNX_KEY: ${DEEPLYNX_KEY:-}
      DEEPLYNX_SECRET: ${DEEPLYNX_SECRET:-}
      DEEPLYNX_ORG_ID: ${DEEPLYNX_ORG_ID:-}
      DEEPLYNX_PROJECT_ID: ${DEEPLYNX_PROJECT_ID:-}
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ../../../certs/ca-bundle.pem:/etc/ssl/certs/ca-bundle.pem
    restart: unless-stopped
