name: Build zensical static site
on:
  push:
    branches:
      - main 
env:
  GIT_DEPTH: 0
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Equivalent to GIT_DEPTH: 0
      - name: Build zensical
        run: |
          cd docs
          uv venv
          uv sync
          uv run zensical build

