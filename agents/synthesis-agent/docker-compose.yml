services:
  synthesis-agent:
    build:
      args:
        - PROMETHEUS_API_BASE_IMAGE_HASH=${PROMETHEUS_API_BASE_IMAGE_HASH:-43dedaa}
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: synthesis-agent
    networks:
      - agent-network
    environment:
      AGENT_HOST: synthesis-agent
      AGENT_PORT: 8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-""}
      MODEL_NAME: ${MODEL_NAME:-claude-sonnet-4-6}
      AGENT_SECRET: ${AGENT_SECRET}
      SSL_CERT_FILE: ${CERT_FILE:-/etc/ssl/certs/ca-bundle.pem}
      REQUESTS_CA_BUNDLE: ${CERT_FILE:-/etc/ssl/certs/ca-bundle.pem}
      NODE_EXTRA_CA_CERTS: ${CERT_FILE:-/etc/ssl/certs/ca-bundle.pem}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ../../shared:/app/shared
      - ${LOCAL_CERT_FILE:-../../certs/ca-bundle.pem}:${CERT_FILE:-/etc/ssl/certs/ca-bundle.pem}
    restart: unless-stopped
