[project]
name = "client-agent"
version = "0.1.0"
description = "Orchestrator for multi-agent analysis workflows"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.3",
    "httpx>=0.26.0",
    "jsonschema>=4.23.0",
    "redis>=5.0.1",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*", "workflow_library*"]

[tool.coverage.run]
source = ["."]
relative_files = true
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
# The lowest total across the supported Python versions; never lower it
fail_under = 77.2
precision = 2
