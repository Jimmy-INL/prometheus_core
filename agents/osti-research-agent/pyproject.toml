[project]
name = "osti-research-agent"
version = "0.1.0"
description = "OSTI literature search and research agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.18.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "marker-pdf>=0.2.0",
    "lxml>=4.9.0",
    "pymupdf>=1.23.0",
]

[tool.uv]
constraint-dependencies = ["a2a-sdk>=1.0.0"]
