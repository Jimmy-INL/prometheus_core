[project]
name = "corrosion-agent"
version = "0.1.0"
description = "Corrosion analysis specialist agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.26.0",
]

[tool.coverage.run]
source = ["."]
relative_files = true
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
# The lowest total across the supported Python versions; never lower it
fail_under = 78.7
precision = 2
