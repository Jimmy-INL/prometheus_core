# INL LiteLLM proxy inference scaffold.
# Replace model IDs and the shared endpoint for the target INL LiteLLM deployment.
#
# litellm.inl.gov/v1 is itself an OpenAI-compatible proxy, so every model routed
# through it (Azure OpenAI-backed or Bedrock-backed) must carry the `openai/`
# provider prefix, matching amsc.yaml's pattern for Claude served over an
# OpenAI-compatible endpoint. Without the prefix, LiteLLM cannot determine how
# to format requests to this api_base.
#
# Chat flavors are Bedrock-backed Claude deployments. Anthropic does not
# supply embeddings, so `embedding` stays on the Azure OpenAI deployment.

model_list:
  - model_name: default
    litellm_params:
      model: openai/claude-sonnet-5-awsgov
      api_key: os.environ/INL_LITELLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: small
    litellm_params:
      model: openai/claude-sonnet-4-5-awsgov
      api_key: os.environ/INL_LITELLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: medium
    litellm_params:
      model: openai/claude-sonnet-5-awsgov
      api_key: os.environ/INL_LITELLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: large
    litellm_params:
      model: openai/claude-opus-4-8-awsgov
      api_key: os.environ/INL_LITELLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: vision
    litellm_params:
      model: openai/claude-opus-4-8-awsgov
      api_key: os.environ/INL_LITELLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: embedding
    litellm_params:
      model: openai/text-embedding-3-large-gov-va
      api_key: os.environ/INL_LITELLM_API_KEY
      api_base: https://litellm.inl.gov/v1
