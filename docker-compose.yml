      - AGENT_PORT=8000
      - REGISTRY_URL=http://registry:8000
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - AGENT_SECRET=${AGENT_SECRET}
      - AGENT_SECRET_REQUIRED=${AGENT_SECRET_REQUIRED:-true}
      - PYTHONDONTWRITEBYTECODE=1
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.pem
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-bundle.pem
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-bundle.pem
    depends_on:
      registry:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped

  # Thermal analysis specialist
  thermal-agent:
    build:
      context: ./agents/thermal-agent
      additional_contexts:
        certs: ${CA_CERT_DIR:-./certs}
        prometheus_api: ./prometheus_api
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: thermal-agent
    ports:
      - "8004:8000"
    networks:
      - agent-network
    environment:
      - AGENT_HOST=thermal-agent
      - AGENT_PORT=8000
      - REGISTRY_URL=http://registry:8000
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - AGENT_SECRET=${AGENT_SECRET}
      - AGENT_SECRET_REQUIRED=${AGENT_SECRET_REQUIRED:-true}
      - PYTHONDONTWRITEBYTECODE=1
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.pem
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-bundle.pem
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-bundle.pem
