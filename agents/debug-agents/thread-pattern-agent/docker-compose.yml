services:
  thread-pattern-agent:
    build:
      args:
        - PROMETHEUS_API_BASE_IMAGE_HASH=${PROMETHEUS_API_BASE_IMAGE_HASH}
        - HTTP_PROXY=${HTTP_PROXY-""}
        - HTTPS_PROXY=${HTTPS_PROXY-""}
        - NO_PROXY=${NO_PROXY-""}
    container_name: thread-pattern-agent
    networks:
      - agent-network
    environment:
      AGENT_PORT: 8000
      AGENT_SECRET: ${AGENT_SECRET}
      SSL_CERT_FILE: /etc/ssl/certs/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-bundle.pem
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-bundle.pem
      REGISTRY_URL: ${REGISTRY_URL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
      # Tunable for the streaming/heartbeat demo (base default is 15s).
      PROMETHEUS_HEARTBEAT_INTERVAL: ${PROMETHEUS_HEARTBEAT_INTERVAL:-15}
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ../../../certs/ca-bundle.pem:/etc/ssl/certs/ca-bundle.pem
      - ../../../shared:/app/shared
    restart: unless-stopped
