codecov:
  notify:
    # One upload per unit that reports coverage; raise it as units are added
    after_n_builds: 3

coverage:
  status:
    # No coverage floors yet
    project: off
    patch: off

# Each unit's report is relative to its own directory; map to the repo root
fixes:
  - "prometheus_api/::sdk/prometheus_api/"
  - "app/::platform/backend/app/"

flags:
  sdk:
    paths:
      - sdk/prometheus_api/
  backend:
    paths:
      - platform/backend/app/
  client-agent:
    paths:
      - platform/agents/client-agent/
