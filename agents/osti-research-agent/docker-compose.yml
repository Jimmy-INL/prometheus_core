services:
  osti-research-agent:
    build:
      args:
        - PROMETHEUS_API_BASE_IMAGE_HASH=${PROMETHEUS_API_BASE_IMAGE_HASH}
        - HTTP_PROXY=${HTTP_PROXY-""}
        - HTTPS_PROXY=${HTTPS_PROXY-""}
        - NO_PROXY=${NO_PROXY-""}
    container_name: osti-research-agent
    networks:
      - agent-network
    environment:
      AGENT_PORT: 8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-""}
      MODEL_NAME: ${MODEL_NAME:-claude-sonnet-4-6}
      AGENT_SECRET: ${AGENT_SECRET}
      SSL_CERT_FILE: /etc/ssl/certs/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-bundle.pem
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-bundle.pem
      REGISTRY_URL: ${REGISTRY_URL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../certs/ca-bundle.pem:/etc/ssl/certs/ca-bundle.pem
      - ../../shared:/app/shared
      - osti-model-cache:/root/.cache/datalab
      - huggingface-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
    restart: unless-stopped

volumes:
  osti-model-cache:
  huggingface-cache:
  torch-cache:
