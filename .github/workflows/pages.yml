name: pages

on:
  push:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  hackathon-build:
    name: "hackathon: build"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Build slides
        working-directory: hackathon/slides
        run: make build
      - name: Check generated slides are up to date
        # Don't publish decks that differ from their slides/*.md sources
        working-directory: hackathon/slides
        run: |
          if [ -n "$(git status --porcelain .)" ]; then
            git status --short .
            git --no-pager diff --stat .
            echo "::error::The generated slides are out of date. Run 'make build' in hackathon/slides and commit the result."
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble site
        # The site serves the slides from /hackathon/
        run: |
          mkdir -p _site/hackathon
          cd hackathon/slides
          cp -R *.html assets ../../_site/hackathon/
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  hackathon-deploy:
    name: "hackathon: deploy"
    needs: hackathon-build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}hackathon/
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
