[project]
name = "prometheus-agent-template"
version = "0.1.0"
description = "Setup tooling for the Prometheus agent template"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
include = ["setup_agent.py"]
relative_files = true

[tool.coverage.report]
# The lowest total across the supported Python versions; never lower it
fail_under = 73.3
precision = 2

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
