name: SDK Tests

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_URL: containers.github.inl.gov
  # Pinned: agent repositories pull the SDK base image by this name, which
  # predates the monorepo, so it must not follow the repository name.
  IMAGE_NAME: prometheus_api
  REGISTRY_PACKAGE_URL: containers.github.inl.gov/${{ github.repository_owner }}/prometheus_api

defaults:
  run:
    working-directory: sdk

jobs:
  python:
    name: "Python ${{ matrix.python }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: 3.12
            image: ghcr.io/astral-sh/uv:0.11.25-python3.12-trixie-slim@sha256:1b9ee30381d729b07044688631ba4473c72db5c048a5f2a504c40186e65efb86
          - python: 3.13
            image: ghcr.io/astral-sh/uv:0.11.25-python3.13-trixie-slim@sha256:dc6831ca75771711b69e2fcaf47f2b4938bcfd7721daf254c1131791249d000d
          - python: 3.14
            image: ghcr.io/astral-sh/uv:0.11.25-python3.14-trixie-slim@sha256:2b2e474b3a72e84c92b18a2f011a14adcb045fb361f7d8667ed1f8f55eefdafd
    runs-on:
      group: genesis
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git
        # Runs before checkout, so sdk/ does not exist yet.
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Sync environment
        run: uv sync --frozen --no-cache
      - name: Test
        shell: bash
        run: |
          source .venv/bin/activate
          pytest --color=yes

  docker-prepare:
    name: "Docker prepare"
    needs:
      - python
    runs-on:
      group: genesis
    outputs:
      build-tag: ${{ steps.prepare.outputs.build-tag }}
      cache-uri: ${{ steps.prepare.outputs.cache-uri }}
      current-tag: ${{ steps.prepare.outputs.current-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare
        id: prepare
        shell: bash
        run: |
          DATE_TAG="$(git log -1 --format=%cd --date=format:'%Y%m%d')"
          COMMIT_TAG="$(git rev-parse HEAD | cut -c1-7)"

          VALUES=(
            "build-tag=${IMAGE_NAME}-build:run-${{ github.run_id }}"
            "cache-uri=${REGISTRY_PACKAGE_URL}-cache"
            "current-tag=${DATE_TAG}-${COMMIT_TAG}"
          )
          for VALUE in "${VALUES[@]}"; do
            echo "$VALUE"
            echo "$VALUE" >> $GITHUB_OUTPUT
          done

  docker:
    name: "Docker ${{ matrix.platform }}"
    runs-on:
      group: genesis
    permissions:
      contents: read
      packages: write
    needs:
      - docker-prepare
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    env:
      BUILD_TAG: "${{ needs.docker-prepare.outputs.build-tag }}-${{ matrix.platform }}"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY_URL" \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Build
        shell: bash
        run: |
          CACHE_URI="${{ needs.docker-prepare.outputs.cache-uri }}"
          test -n "$CACHE_URI"
          CACHE_URI+="-${{ matrix.platform }}"

          EXTRA_ARGS=()
          if [ "$GITHUB_EVENT_NAME" == "push" ]; then
            EXTRA_ARGS+=("--cache-to" "$CACHE_URI")
          fi

          docker build \
            --tag "$BUILD_TAG" \
            --platform "linux/${{ matrix.platform }}" \
            --layers \
            --cache-from "$CACHE_URI" \
            "${EXTRA_ARGS[@]}" \
            .
      - name: Test
        shell: bash
        run: |
          rm -rf prometheus_api

          cat << 'EOF' > run.bash
          #!/bin/bash
          set -e
          uv export --frozen --only-dev > requirements.txt
          uv pip install -r requirements.txt
          rm requirements.txt
          pytest --color=yes
          EOF

          docker run \
            --mount "type=bind,source=${{ github.workspace }},target=${{ github.workspace }}" \
            --workdir "${{ github.workspace }}/sdk" \
            --platform "linux/${{ matrix.platform }}" \
            --rm \
            "$BUILD_TAG" \
            /bin/bash run.bash
      - name: Push
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          CURRENT_TAG="${{ needs.docker-prepare.outputs.current-tag }}"
          test -n "$CURRENT_TAG"

          TO_URI="${REGISTRY_PACKAGE_URL}-${{ matrix.platform }}:${CURRENT_TAG}"
          echo "Pushing ${TO_URI}..."

          docker tag "$BUILD_TAG" "$TO_URI"
          docker push "$TO_URI"
          docker rmi "$TO_URI"
      - name: Registry logout
        if: always()
        run: docker logout "$REGISTRY_URL" || true
      - name: Remove docker image
        if: always()
        run: docker rmi "$BUILD_TAG" || true

  docker-mutli-arch:
    name: "Docker multi-arch"
    if: success() && github.event_name == 'push'
    runs-on:
      group: genesis
    permissions:
      contents: read
      packages: write
    needs:
      - docker-prepare
      - docker
    # No checkout in this job, so sdk/ does not exist.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY_URL" \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Push multi-arch container
        shell: bash
        run: |
          CURRENT_TAG="${{ needs.docker-prepare.outputs.current-tag }}"
          test -n "$CURRENT_TAG"

          # Create multi-arch manifest and push
          CURRENT_URI="${REGISTRY_PACKAGE_URL}:${CURRENT_TAG}"
          echo "Creating multi-arch image ${CURRENT_URI}..."
          docker manifest create "$CURRENT_URI"
          for PLATFORM in amd64 arm64; do
            PLATFORM_URI="${REGISTRY_PACKAGE_URL}-${PLATFORM}:${CURRENT_TAG}"
            docker manifest add "$CURRENT_URI" "$PLATFORM_URI"
          done
          docker manifest push "$CURRENT_URI"

          # Push multi-arch manifest with latest tag
          LATEST_URI="${REGISTRY_PACKAGE_URL}:latest"
          echo "Pushing latest image ${LATEST_URI}..."
          docker manifest push "$CURRENT_URI" "$LATEST_URI"

          # Cleanup
          echo "Cleaning up..."
          docker manifest rm "$CURRENT_URI"
      - name: Registry logout
        if: always()
        run: docker logout "$REGISTRY_URL" || true
