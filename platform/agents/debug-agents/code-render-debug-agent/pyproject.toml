[project]
name = "code-render-debug-agent"
version = "0.1.0"
description = "Deterministic code-sample debug agent for the chat code viewer"
requires-python = ">=3.12"
dependencies = []

[tool.coverage.run]
source = ["."]
relative_files = true
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
# The lowest total across the supported Python versions; never lower it
fail_under = 98.2
precision = 2
