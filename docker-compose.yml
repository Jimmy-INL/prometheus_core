# Prometheus Platform - Combined Docker Compose
# Chainlit frontend + LangGraph client-agent + specialist agents

services:
  # Registry service for agent discovery
  registry:
    build:
      context: ./registry
      additional_contexts:
        certs: ${CA_CERT_DIR:-./certs}
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: agent-registry
    ports:
      - "8000:8000"
    networks:
      - agent-network
    environment:
      - REGISTRY_PORT=8000
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.pem
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-bundle.pem
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-bundle.pem
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis for shared state (conversations, memory, artifacts)
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - agent-network
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped

  # Chainlit frontend UI
  chainlit-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      additional_contexts:
        certs: ${CA_CERT_DIR:-./certs}
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: chainlit-frontend
    ports:
      - "8500:8500"
    networks:
      - agent-network
    environment:
      - CLIENT_AGENT_URL=http://client-agent:8000
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AGENT_SECRET=${AGENT_SECRET}
      - CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
    depends_on:
      registry:
        condition: service_healthy
      client-agent:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  # Client agent - orchestrates the workflow using LangGraph + Claude
  client-agent:
    build:
      context: ./agents/client-agent
      additional_contexts:
        certs: ${CA_CERT_DIR:-./certs}
        prometheus_api: ./prometheus_api
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: client-agent
    ports:
      - "8001:8000"
    networks:
      - agent-network
    environment:
      - AGENT_HOST=client-agent
      - AGENT_PORT=8000
      - REGISTRY_URL=http://registry:8000
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - AGENT_SECRET=${AGENT_SECRET}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.pem
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-bundle.pem
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-bundle.pem
    depends_on:
      registry:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped

  # Corrosion analysis specialist
  corrosion-agent:
    build:
      context: ./agents/corrosion-agent
      additional_contexts:
        certs: ${CA_CERT_DIR:-./certs}
        prometheus_api: ./prometheus_api
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: corrosion-agent
    ports:
      - "8002:8000"
    networks:
      - agent-network
    environment:
      - AGENT_HOST=corrosion-agent
      - AGENT_PORT=8000
      - REGISTRY_URL=http://registry:8000
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - AGENT_SECRET=${AGENT_SECRET}
      - AGENT_SECRET_REQUIRED=${AGENT_SECRET_REQUIRED:-true}
      - PYTHONDONTWRITEBYTECODE=1
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.pem
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-bundle.pem
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-bundle.pem
    depends_on:
      registry:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped

  # Radiation damage specialist
  radiation-agent:
