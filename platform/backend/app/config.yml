chat-intro: "Welcome to the Prometheus Platform."
chat-suggestion-title: "What would you like to do today?"
workflow-suggestions:
  - "Design a Rankine cycle based power generation system for a Sodium Fast Reactor. Core power rating is 390 MW, turbine output is 170.9 MW"
  - "Create a single-loop PWR primary coolant system with an RPV, SG, and a Pump connected in a closed loop."
  - "Run FTL Safety Analysis"
  - "Design a nuclear system"
  - "Perform a thermal analysis of SS316 at 400C"
  - "Do a comprehensive material analysis of SS347"
  - "Make an image with the word Success in red in it"

# Local users no longer come from this file -- they live in the admin-plane
# Postgres database. On first run (no users row yet), the app serves a setup
# wizard that creates the first admin account; see docs/docs/dev-docs/multi-user-setup.md.

# A2A client-agent connection (overridden by env vars CLIENT_AGENT_URL, AGENT_SECRET, REDIS_URL)
agent-url: "http://localhost:8001"
agent-secret: ""
redis-url: "redis://localhost:6379"

# Upload handling (overridden by env var PROMETHEUS_MAX_UPLOAD_BYTES)
max-upload-bytes: 104857600

# Mesh (Exodus/STL) → VTP conversion cache root (empty = <tempdir>/prometheus-mesh).
# Overridden by env PROMETHEUS_MESH_CACHE_DIR. Point this at a persistent volume in
# production -- docker-compose.yml mounts the `mesh-cache` volume for exactly this.
mesh-cache-dir: ""
# VTK conversion subprocess pool size, *per web worker* (env PROMETHEUS_MESH_WORKERS).
mesh-workers: 2
# Wall-clock budget for one conversion, in seconds (env PROMETHEUS_MESH_TIMEOUT_SECONDS).
# On expiry the worker is killed and that artifact degrades to a file download.
mesh-timeout-seconds: 120

debug: false
auto-approve-steps: false

# Auth / session cookie (jwt-secret overridden by env BACKEND_JWT_SECRET)
jwt-secret: ""
cookie-name: "prometheus_session"
token-ttl-seconds: 86400
